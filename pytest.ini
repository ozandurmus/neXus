[pytest]
# PR0 explicit LIVE_TOOLING manifest; source paths stay in place until PR3.
# See tests/README.md for inventory exceptions and legacy opt-in.
testpaths =
    tests/test_ci_regression_scope.py
    tests/test_ci_workflow_fast_pr_regression.py
    tests/test_cold_start_budget.py
    tests/test_contract_authority_status.py
    tests/test_cp_policy_gate_contract.py
    tests/test_design_cross_references_resolve.py
    tests/test_dev0_4_repository_privacy_gate.py
    tests/test_dispatch_ledger.py
    tests/test_e2e_canary_digests.py
    tests/test_faster_ship.py
    tests/test_frozen_contract_shapes.py
    tests/test_gov_orch_9_backlog_split.py
    tests/test_gov_po_3_ci_privacy_gate_baseline.py
    tests/test_gov_po_role.py
    tests/test_gov_relay_protocol.py
    tests/test_gov_session_transfer.py
    tests/test_hosta_test_modes.py
    tests/test_live_project_governance.py
    tests/test_live_tooling_discovery.py
    tests/test_local_relay_protocol.py
    tests/test_migration_audit_context.py
    tests/test_migration_versions_unique.py
    tests/test_nexus_engineer_tool_gate.py
    tests/test_orchestrator.py
    tests/test_orchestrator_dashboard.py
    tests/test_orchestrator_dashboard_browser.py
    tests/test_orchestrator_install_hooks.py
    tests/test_orchestrator_preflight.py
    tests/test_orchestrator_providers.py
    tests/test_orchestrator_usage.py
    tests/test_orchestrator_verify.py
    tests/test_pan_policy_gate_contract.py
    tests/test_po_scope_check.py
    tests/test_policy_hit_gate_contract.py
    tests/test_preview_e2e.py
    tests/test_project_files_budget.py
    tests/test_project_plan_render_equivalence.py
    tests/test_project_queue.py
    tests/test_security_scans.py
    tests/test_standalone_orchestrate.py
    tests/test_successor_index.py
    tests/test_ui2_deployment_manifests.py
    tests/test_vendor_neutral_governance.py
    tests/test_workbench_companion.py
    tests/test_worker_brief.py
    tests/test_worker_prepush.py
norecursedirs = history node_modules .git .venv
markers =
    inventory: raw network inventory collection/merge/snapshot (CP, PAN, VSX runtime; parser/verification/support-bundle characterization)
    configuration: current-configuration collection, alignment, history, content-addressed storage, and the Configuration UI payload
    compliance: compliance posture, the user-check engine, framework/catalog mappings, crypto/PQC posture, and the compliance trend ledger
    discovery: discovery lifecycle, capability registry, the collection coordinator/scheduler, and inventory exclusions
    render: HTML export, the render harness, and render performance profiling
    runtime_platform: runtime path/bootstrap foundation, authentication boundary, credential redaction, and the repository privacy gate
    security: SSH host-key trust and TLS CA trust closures
    recovery: backup/recovery plane (RB.x) -- restore-readiness, the recovery store, manifest validation, and the Recovery UI payload
    operate: OP.2 class 2 execution foundation -- typed action lifecycle, HA-entity lock/quarantine, mutation boundary, crash reconciliation
    replay: PRIVATE_REPLAY / SYNTHETIC_SCENARIO Phase A -- privacy/fidelity policy and the replay isolation boundary (docs/design/PRIVATE_REPLAY_ARCHITECTURE.md)

# Usage: py -m pytest -m compliance   (a single feature area)
#        py -m pytest -m "not security"   (everything except one area)
# Every test file carries exactly one of these as a module-level `pytestmark`;
# this does not replace the phase-scoped test-file convention documented in
# AI_START_HERE.md (one file per build/contract stays the source of truth for
# what tests a given build introduced) -- it only adds a cross-cutting way to
# run a feature slice without touching file layout.
