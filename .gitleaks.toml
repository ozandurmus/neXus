title = "neXus security baseline (2026-09-30)"

[extend]
useDefault = true

# Runtime-built replacements do not remove these exact synthetic fixtures from Git history.
[[allowlists]]
description = "Exact historical diagnostic and inventory test fixtures"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
    '''^synthetic-value$''',
    '''^synthetic-inventory-mask-key-0001$''',
    # base64 of synthetic-user / synthetic-pass in preview tests, PO 2026-10-08; review 2026-12-31
    '''^c3ludGhldGljLXVzZXI=$''',
    '''^c3ludGhldGljLXBhc3M=$''',
]

# PO-approved retired dashboard token; preserve history. No working-tree path exemption.
[[allowlists]]
description = "Retired local dashboard bearer token, PO 2026-09-30; review 2026-12-31"
targetRules = ["generic-api-key"]
commits = ["8288cb4cd61178d049d348da39d95816f5e93852"]

# Exact synthetic fixture paths, scoped to this rule; all other rules remain active.
# Configuration syntax: https://github.com/gitleaks/gitleaks#configuration
[[allowlists]]
description = "Seven synthetic test fixtures, PO 2026-09-30; review 2026-12-31"
targetRules = ["generic-api-key"]
paths = [
    '''^ui2/job-engine/src/test/java/com/securityexpert/nexus/ui2/jobs/failover/FailoverScheduleJobEngineTest\.java$''',
    '''^ui2/persistence/src/test/java/com/securityexpert/nexus/ui2/persistence/credential/CredentialAdministrationTest\.java$''',
    '''^ui2/service/src/test/java/com/securityexpert/nexus/ui2/service/api/CredentialAdministrationControllerTest\.java$''',
    '''^ui2/service/src/test/java/com/securityexpert/nexus/ui2/service/api/LocalIdentityAdministrationControllerTest\.java$''',
    '''^ui2/worker/src/test/java/com/securityexpert/nexus/ui2/worker/discovery/cp/StoreBackedSshCredentialResolverTest\.java$''',
    '''^ui2/worker/src/test/java/com/securityexpert/nexus/ui2/worker/discovery/pan/PanFixtures\.java$''',
    '''^ui2/worker/src/test/java/com/securityexpert/nexus/ui2/worker/discovery/pan/StoreBackedPanCredentialResolverTest\.java$''',
]

# Redaction and masking tests must contain secret-shaped synthetic lines (PEM blocks, key=value, bearer blobs) to
# prove they are redacted; none is an operational credential. Exact paths, these two rules only.
# System-log phase B, orchestrator under the PO mandate of 2026-10-15; review 2026-12-31.
[[allowlists]]
description = "Synthetic secret-shaped lines in the system-log redaction and masking tests; review 2026-12-31"
targetRules = ["generic-api-key", "private-key"]
paths = [
    '''^ui2/worker/src/test/java/com/securityexpert/nexus/ui2/worker/systemlog/redaction/LogRedactorTest\.java$''',
    '''^ui2/service/src/test/java/com/securityexpert/nexus/ui2/service/systemlog/LogMaskingTest\.java$''',
]
