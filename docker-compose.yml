# DEV.3.1 — single worker container + nginx serving the static output volume.
# No collector-semantic change; this only relocates where the existing
# main.py pipeline runs. See docs/history/phase/DEV3_1_LINUX_CONTAINER_IMAGE.md.
#
# Quick start:
#   cp .env.example .env   # fill in credentials, or use the _FILE / secrets: convention below
#   docker compose up -d
#   docker compose exec worker python main.py --repository-privacy-check   # no credentials needed
#   docker compose exec worker python main.py --persistent-secret-material-check  # DEV.2.2 volume/trust contract check
#   docker compose exec worker python main.py --render-only                # needs a prior real checkpoint's artifacts
#   curl http://127.0.0.1:8080/                                            # the rendered report
#
# nginx is bound to 127.0.0.1 only, deliberately: output/index.html is a
# LOCAL OPERATOR SENSITIVE artifact (roadmap.json roadmap_notes) and serving
# it beyond loopback without the DEPLOY.1A authenticated viewer boundary is
# not an accepted default here -- widening this bind address is a DEPLOY.1A
# decision, not a casual config change.

services:
  worker:
    build: .
    image: securityexpert-worker:dev
    env_file:
      # required: false -- a fresh checkout has no .env yet; --repository-privacy-check
      # and other no-credential modes must still be runnable to validate the image.
      - path: .env
        required: false
    environment:
      SECURITYEXPERT_RUNTIME_ROOT: /runtime
      # RB.1 recovery-plane store (docs/design/BACKUP_RECOVERY_CONTRACTS.md
      # §2) -- physically separate from the evidence volume above, on its
      # own named volume, mounted ONLY on worker. Never add this volume to
      # the nginx service: recovery artifacts are encrypted vendor-native
      # backups (secrets), not the sanitized report -- contract §9.11.
      SECURITYEXPERT_RECOVERY_ROOT: /recovery
    volumes:
      - securityexpert-runtime:/runtime
      - securityexpert-recovery:/recovery
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      # Deliberately NOT securityexpert-recovery -- see the worker comment
      # above and contract §9.11 ("nginx never mounts the recovery volume").
      - securityexpert-runtime:/runtime:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - worker
    restart: unless-stopped

volumes:
  # Persistent runtime state (data/output/logs, HMAC key, trust material).
  # data_root (and therefore data/.support_hmac.key) lives under this volume
  # via SECURITYEXPERT_RUNTIME_ROOT, so the support-bundle identity key is
  # already stable across `docker compose restart` / recreate as long as the
  # volume itself is retained. For the production-grade mounted-and-required
  # CP known_hosts / PAN CA bundle contract, use docker-compose.prod.yml as
  # an overlay -- see docs/history/phase/DEV2_2_PERSISTENT_SECRET_MATERIAL.md.
  securityexpert-runtime:
  # RB.1 encrypted recovery-plane vault (vendor-native backups). Separate
  # volume, separate lifecycle from securityexpert-runtime above -- a
  # compromise or wipe of one must not take the other with it (architecture
  # docs/design/BACKUP_AND_RECOVERY_ARCHITECTURE.md §4). Not yet written to
  # by anything (RB.2/RB.3 collection is gated); provisioned now so the
  # storage exists ahead of collection capability.
  securityexpert-recovery:
