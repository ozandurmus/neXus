# Deterministic validation gate.
#
# DEV.TEST.1 final topology (2026-09-06, Product Owner directed): every
# pull_request runs the fast `validate` gate only. `full-regression` (the
# full suite, parallelized -- see its own step comment) never starts
# automatically -- not on pull_request, not on push to main -- it runs only
# through an explicit `workflow_dispatch`. There is deliberately no `push:`
# trigger at all: with `full-regression` withheld from automatic triggers
# and `validate` restricted to pull_request, a push-to-main event would
# match no job's `if:` condition and produce an empty, zero-job workflow
# run -- removed rather than shipped that way. A GitHub-hosted
# full-regression run is now an exceptional, materially justified action
# (see docs/AI_DEVELOPMENT_PROTOCOL.md "CI validation policy"); the
# already-proven local/agent-cloud parallel run
# (`python -m pytest -q -n auto --dist worksteal`) is normally sufficient
# evidence. Workflow run 34020356372 (push-to-main, pre-dating this
# correction) remains on record as one-time proof that parallel execution
# itself works on GitHub-hosted infrastructure -- it is not authorization
# for automatic full-regression on every push, which this correction
# removes.
#
# CORRECTION (2026-09-06, post-merge, kept for context): this file briefly
# shipped a genuine YAML syntax defect -- the "Report worker topology"
# step's `run:` value was an unquoted plain scalar containing a bare `: `
# (colon-space) inside an f-string label ("...target): {os.cpu_count()}"),
# which YAML parses as an illegal nested mapping. That is a hard parse
# failure GitHub Actions cannot recover from: it produced a zero-job,
# immediately-failing check suite for every trigger on every branch,
# including ordinary push-to-main, from this file's very first commit
# through the PR #87 merge. It was initially misdiagnosed in-session as an
# environment/automation-identity limitation on scheduling pull_request/
# workflow_dispatch jobs on non-default branches -- that diagnosis was
# wrong; the real cause was this file failing to parse, full stop,
# unrelated to branch, event type, or pusher identity. Fixed by quoting/
# rewording the offending f-string. This changes test PLACEMENT/FREQUENCY
# only -- no check is weakened, hidden, or made skippable, and no
# dependency/service/credential is added beyond what the previous
# single-job version already used.
name: validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FAST PR VALIDATION — runs on every pull_request. Cheap, high-value gates
  # only: import sanity, the repository/privacy gate, project-state
  # consistency, the build-history index, a small stable safety/regression
  # smoke set, and the whitespace/conflict-marker check. Deliberately does
  # NOT run the full pytest suite (see the `full-regression` job below).
  # Job id kept as `validate` (unchanged from the previous single-job
  # workflow) so an existing branch-protection required-status-check named
  # `validate` keeps matching on pull_request events without repository
  # settings needing to change.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          # AC-4 (relay/NXS-LOCAL-0020): the privacy gate's baseline scan
          # below needs `git merge-base HEAD origin/main` to resolve, which
          # needs both HEAD's and main's history actually present locally.
          # actions/checkout's default fetch-depth (1) only fetches the
          # single commit being built -- no parents, no other branches --
          # so merge-base would fail closed with "fatal: no merge base"
          # every time. fetch-depth: 0 fetches full history for the ref
          # being checked out (the PR merge commit), whose own ancestry
          # already includes origin/main's history up to the merge point.
          fetch-depth: 0

      - name: Fetch origin/main for the privacy-gate baseline
        # `origin/main` is not created as a local ref by the checkout above
        # (it only fetches the PR merge/head ref by name, with no configured
        # remote-tracking refspec) -- fetch it explicitly, to the exact ref
        # name `--privacy-baseline-ref origin/main` resolves, so it exists
        # to resolve. Cheap: this is a single branch, not the whole repository.
        run: git fetch origin +main:refs/remotes/origin/main

      - uses: actions/setup-python@v5
        with:
          # Matches the validated 3.12 baseline the Dockerfile and the dev
          # tooling both target.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-console.txt

      - name: Import validation
        # Catches a syntax error or a broken import before anything else
        # spends time on it, and covers modules no test imports directly.
        run: python -m compileall -q main.py application console configuration checkpoint panorama utils scripts

      - name: Repository privacy gate
        # Must run on the clean checkout, BEFORE any test run: a test run
        # creates gitignored data/ + logs/ that the gate would otherwise flag.
        # AC-3/AC-4 (relay/NXS-LOCAL-0020): baselined against origin/main's
        # merge-base with HEAD -- a finding already present there is
        # pre-existing repository debt (scripts/nexus_engineer_tool_gate.py's
        # pre-push hook already treats it that way) and must not fail CI on
        # every PR; a genuinely new finding still fails exactly as before.
        run: python main.py --repository-privacy-check --privacy-baseline-ref origin/main

      - name: Project-state consistency
        # The cross-authority rules in utils/project_plan. Fails when
        # CURRENT_STATE.md, roadmap.json, feature_registry.json,
        # build_history.json and backlog.json stop agreeing.
        run: python -m pytest -q tests/test_architecture_convergence.py

      - name: Build history index is current
        run: python scripts/build_history_index.py --check

      - name: Project queue is current
        run: python3 scripts/project_queue.py check

      - name: PR smoke / safety regression set
        # A small, stable, hand-picked set of fast tests that stand in for
        # "affected-subsystem regression" on an ordinary bounded PR — not a
        # path->test classifier (deliberately not built: see
        # docs/AI_DEVELOPMENT_PROTOCOL.md "Testing tiers"). Covers the
        # invariants a regression here would most likely break: credential
        # redaction, the repository privacy gate's own test surface, known
        # safety-gap coverage, and the frontend-rendering shared-state-leak
        # guard called out in the full-suite step's own long-standing
        # comment. A change with a wider blast radius (dependencies, shared
        # test infra, schema/storage, concurrency, security boundary, CI
        # infra itself, or an explicit PO/contract requirement) still
        # requires a full regression per AI_START_HERE.md's validation
        # ladder and AGENTS.md's engineering laws — run it locally or via
        # workflow_dispatch before merging such a PR.
        run: >-
          python -m pytest -q
          tests/test_credential_redaction.py
          tests/test_dev0_4_repository_privacy_gate.py
          tests/test_known_safety_gaps.py
          tests/test_frontend_rendering_boundary.py

      - name: Whitespace / conflict-marker check
        # Checks the whole HEAD tree against git's constant empty-tree SHA,
        # not against a base ref -- github.event.pull_request.base.sha and
        # github.event.before are both unset on workflow_dispatch, and
        # actions/checkout@v4 defaults to a depth-1 clone, so a base-ref diff
        # fails closed with "fatal: bad object" on exactly those triggers.
        # The empty-tree comparison needs only HEAD, which checkout always has.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
        continue-on-error: true

  # FULL INTEGRATION REGRESSION — on-demand only (DEV.TEST.1 final
  # topology, 2026-09-06): runs ONLY via an explicit `workflow_dispatch`,
  # never automatically on pull_request or push. DEV.TEST.1 parallelized
  # the "Full test suite" step itself (see its own step comment); a
  # GitHub-hosted run of this job is an exceptional, materially justified
  # action, not the default validation path -- see this file's header
  # comment and docs/AI_DEVELOPMENT_PROTOCOL.md "CI validation policy".
  full-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # See the `validate` job's identical step comment above: the
          # privacy gate's baseline scan needs origin/main's history
          # actually present locally, which the default depth-1 checkout
          # does not provide.
          fetch-depth: 0

      - name: Fetch origin/main for the privacy-gate baseline
        # workflow_dispatch is normally run against a PR branch, in which
        # case origin/main is a real, distinct baseline exactly as in the
        # `validate` job. Dispatched directly on main itself, HEAD and
        # origin/main coincide and the comparison is a no-op (every finding
        # reads as pre-existing) -- an accepted, narrow gap for this
        # exceptional, human-triggered path (AC-4/AC-5): it does not touch
        # the actual live bug (AC-1), which is pull_request's `validate` job.
        run: git fetch origin +main:refs/remotes/origin/main

      - uses: actions/setup-python@v5
        with:
          # Matches the validated 3.12 baseline the Dockerfile and the dev
          # tooling both target.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-console.txt

      - name: Import validation
        # Catches a syntax error or a broken import before the suite spends
        # time on it, and covers modules no test imports directly.
        run: python -m compileall -q main.py application console configuration checkpoint panorama utils scripts

      - name: Repository privacy gate
        # Must run on the clean checkout, BEFORE the suite: a test run creates
        # gitignored data/ + logs/ that the gate would otherwise flag.
        run: python main.py --repository-privacy-check --privacy-baseline-ref origin/main

      - name: Project-state consistency
        # The cross-authority rules in utils/project_plan. Fails when
        # CURRENT_STATE.md, roadmap.json, feature_registry.json,
        # build_history.json and backlog.json stop agreeing.
        run: python -m pytest -q tests/test_architecture_convergence.py

      - name: Build history index is current
        run: python scripts/build_history_index.py --check

      - name: Project queue is current
        run: python3 scripts/project_queue.py check

      - name: Report worker topology
        # DEV.TEST.1: makes the parallel step's actual worker count visible in
        # the log rather than leaving `-n auto`'s choice implicit.
        run: python -c "import os; print(f'CPU count (xdist -n auto target) -> {os.cpu_count()}')"

      - name: Full test suite (parallel)
        # DEV.TEST.1 (2026-09-06): parallelized. The prior "serial on purpose"
        # reasoning no longer holds -- the actual root cause of the suite's two
        # long-standing order-dependent failures was scripts/render_uitest.py
        # leaving three utils.html_export payload builders rebound after an
        # in-process call (a bare module-level rebind, not monkeypatch.setattr,
        # so it silently outlived the call and leaked into whichever later
        # run_html_export() shared its worker). That is now fixed with a
        # try/finally restore (scripts/render_uitest.py::_injected_builders)
        # and directly regression-tested regardless of worker/order
        # (tests/test_frontend_rendering_boundary.py::
        # test_render_uitest_restores_the_builders_it_injects) -- so the one
        # concrete leak that motivated running this job serially is now caught
        # by a guard test, not by hoping the polluter and its victim land in
        # the same process. `-n auto --dist worksteal` matches the exact
        # command already proven locally (requirements-dev.txt,
        # scripts/pytest_one_shot.ps1, docs/AI_DEVELOPMENT_PROTOCOL.md); a
        # serial run remains available as an explicit diagnostic override
        # (`-n0`), never the default validation path. A single pytest-xdist
        # master process aggregates every worker's result into one exit code,
        # so no worker's failure can be masked by another worker's pass.
        run: python -m pytest -q -n auto --dist worksteal

      - name: Whitespace / conflict-marker check
        # Checks the whole HEAD tree against git's constant empty-tree SHA,
        # not against a base ref -- github.event.pull_request.base.sha and
        # github.event.before are both unset on workflow_dispatch, and
        # actions/checkout@v4 defaults to a depth-1 clone, so a base-ref diff
        # fails closed with "fatal: bad object" on exactly those triggers.
        # The empty-tree comparison needs only HEAD, which checkout always has.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
        continue-on-error: true
