# Deterministic validation gate.
#
# DEV.TEST.1 cost reasoning (2026-09-06) remains: GitHub-hosted full
# regression is expensive, while the parallel local/agent-cloud command
# (`python -m pytest -q -n auto --dist worksteal`) is proven. PO decision
# 2026-09-16 successor amendment narrows 2026-09-15C: major changes run the
# full suite, the approved LDAP delivery runs fixed targeted checks, and
# unknown paths block visibly. There is still no `push:` trigger. Workflow run 34020356372
# remains one-time proof that parallel execution works on GitHub-hosted
# infrastructure, not authorization to run it on every pull request.
#
# CORRECTION (2026-09-06, post-merge, kept for context): this file briefly
# shipped a genuine YAML syntax defect -- the "Report worker topology"
# step's `run:` value was an unquoted plain scalar containing a bare `: `
# (colon-space) inside an f-string label ("...target): {os.cpu_count()}"),
# which YAML parses as an illegal nested mapping. That is a hard parse
# failure GitHub Actions cannot recover from: it produced a zero-job,
# immediately-failing check suite for every trigger on every branch,
# including ordinary push-to-main, from this file's very first commit
# through the PR #87 merge. It was initially misdiagnosed in-session as an
# environment/automation-identity limitation on scheduling pull_request/
# workflow_dispatch jobs on non-default branches -- that diagnosis was
# wrong; the real cause was this file failing to parse, full stop,
# unrelated to branch, event type, or pusher identity. Fixed by quoting/
# rewording the offending f-string. This changes test PLACEMENT/FREQUENCY
# only -- no check is weakened, hidden, or made skippable, and no
# dependency/service/credential is added beyond what the previous
# single-job version already used.
name: validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GOV.ORCH.7 section 2.3 item 3 -- PO write-scope enforcement. Runs only
  # for a `gov/po-*` head branch; every other branch's PR is unaffected
  # (`check-latest`/skip semantics: the job's own `if:` gates entry, not a
  # step inside it, so it costs nothing on an ordinary PR).
  po-scope-check:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'gov/po-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main
        run: git fetch origin +main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: PO write-scope check
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          python3 tools/delivery/nexus_po_scope_check.py
          --branch "$HEAD_REF" --base origin/main

  regression-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.scope.outputs.classification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch PR base for changed-path scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "+${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Classify changed paths with the closed approved mapping
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git diff --name-only "origin/${BASE_REF}"...HEAD | python3 tools/delivery/ci_regression_scope.py --github-output "$GITHUB_OUTPUT"; then
            echo "classification=blocked" >> "$GITHUB_OUTPUT"
          fi

  scope-blocked:
    needs: regression-scope
    if: always() && github.event_name == 'pull_request' && needs.regression-scope.outputs.classification == 'blocked'
    runs-on: ubuntu-latest
    steps:
      - name: Block unmapped or failed regression selection
        run: exit 1

  targeted-regression:
    needs: regression-scope
    if: always() && github.event_name == 'pull_request' && (needs.regression-scope.outputs.classification == 'ldap' || contains(needs.regression-scope.outputs.classification, 'discovery') || contains(needs.regression-scope.outputs.classification, 'inventory') || contains(needs.regression-scope.outputs.classification, 'privacy') || contains(needs.regression-scope.outputs.classification, 'shell'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch privacy baseline
        run: git fetch origin +main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare declared Python test dependencies
        run: pip install -r requirements-dev.txt
      - name: Targeted routing and real-root privacy regression
        run: >-
          python3 -m pytest -q -n 2 --dist worksteal
          tools/tests/test_ci_workflow_fast_pr_regression.py tools/tests/test_ci_regression_scope.py
          tools/tests/test_gov_po_3_ci_privacy_gate_baseline.py tools/tests/test_nexus_engineer_tool_gate.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare frontend for targeted regression
        run: |
          npm --prefix ui2/frontend ci
          npm --prefix ui2/frontend run build
      - name: Approved LDAP targeted regression
        if: needs.regression-scope.outputs.classification == 'ldap'
        run: |
          npm --prefix ui2/frontend test -- tests/ProjectPlanPanel.test.tsx tests/LoginScreen.test.tsx tests/AuthGate.test.tsx
          ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true :ldap-adapter:unitTest :platform-core:unitTest :persistence:unitTest :cli:unitTest :architecture-tests:architectureTest
          ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true :service:unitTest --tests '*Login*' --tests '*RoleBinding*' --tests '*Rbac*' --tests '*Directory*' --tests '*Security*' --tests '*Local*' --tests '*ProjectPlanReader*' --tests '*FirstBoot*'
      - name: Discovery targeted regression
        if: contains(needs.regression-scope.outputs.classification, 'discovery')
        run: ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true :platform-core:unitTest :persistence:unitTest :service:unitTest :worker:unitTest :job-engine:unitTest
      - name: Inventory targeted regression
        if: contains(needs.regression-scope.outputs.classification, 'inventory')
        run: |
          npm --prefix ui2/frontend test -- tests/AdministrationScreen.test.tsx
          ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true :persistence:unitTest --tests '*JooqDeviceRepositoryTest'
          ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true :service:unitTest --tests '*Device*'
          ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true :worker:unitTest --tests '*Inventory*'
      - name: Privacy targeted regression
        if: contains(needs.regression-scope.outputs.classification, 'privacy')
        run: ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true :service:unitTest --tests '*TopologyNamePseudonymizerTest'
      - name: Shell targeted regression
        if: contains(needs.regression-scope.outputs.classification, 'shell')
        run: |
          npm --prefix ui2/frontend test -- tests/App.test.tsx

  # Keep the required validate status: privacy, live tooling and project checks.
  # The explicit pytest.ini manifest excludes the retired Python product.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # AC-4 (relay/NXS-LOCAL-0020): the privacy gate's baseline scan
          # below needs `git merge-base HEAD origin/main` to resolve, which
          # needs both HEAD's and main's history actually present locally.
          # actions/checkout's default fetch-depth (1) only fetches the
          # single commit being built -- no parents, no other branches --
          # so merge-base would fail closed with "fatal: no merge base"
          # every time. fetch-depth: 0 fetches full history for the ref
          # being checked out (the PR merge commit), whose own ancestry
          # already includes origin/main's history up to the merge point.
          fetch-depth: 0

      - name: Fetch origin/main for the privacy-gate baseline
        # `origin/main` is not created as a local ref by the checkout above
        # (it only fetches the PR merge/head ref by name, with no configured
        # remote-tracking refspec) -- fetch it explicitly, to the exact ref
        # name `--privacy-baseline-ref origin/main` resolves, so it exists
        # to resolve. Cheap: this is a single branch, not the whole repository.
        run: git fetch origin +main:refs/remotes/origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Matches the validated 3.12 baseline the Dockerfile and the dev
          # tooling both target.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Repository privacy gate
        # Must run on the clean checkout, BEFORE any test run: a test run
        # creates gitignored data/ + logs/ that the gate would otherwise flag.
        # AC-3/AC-4 (relay/NXS-LOCAL-0020): baselined against origin/main's
        # merge-base with HEAD -- a finding already present there is
        # pre-existing repository debt (tools/delivery/nexus_engineer_tool_gate.py's
        # pre-push hook already treats it that way) and must not fail CI on
        # every PR; a genuinely new finding still fails exactly as before.
        run: python3 tools/privacy/repository_privacy_check.py --privacy-baseline-ref origin/main

      - name: Project-state consistency
        # The cross-authority rules in tools/delivery/project_plan. Fails when
        # CURRENT_STATE.md, roadmap.json, feature_registry.json,
        # build_history.json and backlog.json stop agreeing.
        run: python -m pytest -q tools/tests/test_live_project_governance.py

      - name: Build history index is current
        run: python tools/delivery/build_history_index.py --check

      - name: Project queue is current
        run: python3 tools/delivery/project_queue.py check

      - name: Project file size budgets
        # GOV.ORCH.8 2.4: backlog/roadmap/build_history/feature_registry.json
        # and QUEUE.md size ceilings, plus the no-long-narrative-field rule.
        run: python -m pytest -q tools/tests/test_project_files_budget.py

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare declared Chromium test runtime
        run: python -m playwright install --with-deps chromium

      - name: Live tooling regression
        run: python -m pytest -q -n 2 --dist worksteal

      - name: Whitespace / conflict-marker check
        # Checks the whole HEAD tree against git's constant empty-tree SHA,
        # not against a base ref -- github.event.pull_request.base.sha and
        # github.event.before are both unset on workflow_dispatch, and
        # actions/checkout@v4 defaults to a depth-1 clone, so a base-ref diff
        # fails closed with "fatal: bad object" on exactly those triggers.
        # The empty-tree comparison needs only HEAD, which checkout always has.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
        continue-on-error: true

  # FULL INTEGRATION REGRESSION — PO decision 2026-09-16 successor: runs on
  # manual dispatch and closed-path classifications that require it.
  # `always()` preserves workflow_dispatch when the PR-only scope job skips.
  full-regression:
    needs: regression-scope
    if: always() && (github.event_name == 'workflow_dispatch' || needs.regression-scope.outputs.classification == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # See the `validate` job's identical step comment above: the
          # privacy gate's baseline scan needs origin/main's history
          # actually present locally, which the default depth-1 checkout
          # does not provide.
          fetch-depth: 0

      - name: Fetch origin/main for the privacy-gate baseline
        # workflow_dispatch is normally run against a PR branch, in which
        # case origin/main is a real, distinct baseline exactly as in the
        # `validate` job. Dispatched directly on main itself, HEAD and
        # origin/main coincide and the comparison is a no-op (every finding
        # reads as pre-existing) -- an accepted, narrow gap for this
        # exceptional, human-triggered path (AC-4/AC-5): it does not touch
        # the actual live bug (AC-1), which is pull_request's `validate` job.
        run: git fetch origin +main:refs/remotes/origin/main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Matches the validated 3.12 baseline the Dockerfile and the dev
          # tooling both target.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare declared Chromium test runtime
        run: python -m playwright install --with-deps chromium

      - name: Repository privacy gate
        # Must run on the clean checkout, BEFORE the suite: a test run creates
        # gitignored data/ + logs/ that the gate would otherwise flag.
        run: python3 tools/privacy/repository_privacy_check.py --privacy-baseline-ref origin/main

      - name: Project-state consistency
        # The cross-authority rules in tools/delivery/project_plan. Fails when
        # CURRENT_STATE.md, roadmap.json, feature_registry.json,
        # build_history.json and backlog.json stop agreeing.
        run: python -m pytest -q tools/tests/test_live_project_governance.py

      - name: Build history index is current
        run: python tools/delivery/build_history_index.py --check

      - name: Project queue is current
        run: python3 tools/delivery/project_queue.py check

      - name: Project file size budgets
        # GOV.ORCH.8 2.4: backlog/roadmap/build_history/feature_registry.json
        # and QUEUE.md size ceilings, plus the no-long-narrative-field rule.
        run: python -m pytest -q tools/tests/test_project_files_budget.py

      - name: Report worker topology
        # DEV.TEST.1: makes the parallel step's actual worker count visible in
        # the log rather than leaving `-n auto`'s choice implicit.
        run: python -c "import os; print(f'CPU count (xdist -n auto target) -> {os.cpu_count()}')"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Full live tooling suite (parallel)
        run: python -m pytest -q -n auto --dist worksteal

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Frontend validation and build
        working-directory: ui2/frontend
        run: |
          npm ci
          npx tsc --noEmit -p .
          npx vitest run
          npm run build
      - name: Java unit and architecture regression
        run: ./ui2/gradlew --no-daemon --console=plain -p ui2 -PfrontendPrebuilt=true unitTest architectureTest

      - name: Whitespace / conflict-marker check
        # Checks the whole HEAD tree against git's constant empty-tree SHA,
        # not against a base ref -- github.event.pull_request.base.sha and
        # github.event.before are both unset on workflow_dispatch, and
        # actions/checkout@v4 defaults to a depth-1 clone, so a base-ref diff
        # fails closed with "fatal: bad object" on exactly those triggers.
        # The empty-tree comparison needs only HEAD, which checkout always has.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
        continue-on-error: true
