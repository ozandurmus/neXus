apiVersion: batch/v1
kind: Job
metadata:
  name: ui2-migrate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: ui2-migrate }
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 65532
      containers:
        - name: migrate
          image: nexus-ui2
          args: ["migrate"]
          env:
            - name: SECURITYEXPERT_UI2_MIGRATE_DB_DSN_FILE
              value: /var/run/ui2-secrets/db-dsn
          volumeMounts:
            - name: migrate-secrets
              mountPath: /var/run/ui2-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: migrate-secrets
          secret:
            secretName: ui2-migrate-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
