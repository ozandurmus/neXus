apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui2-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: ui2-service }
  template:
    metadata:
      labels: { app: ui2-service }
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: service
          image: nexus-ui2
          args: ["service"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: SECURITYEXPERT_UI2_SERVICE_DB_DSN_FILE
              value: /var/run/ui2-secrets/db-dsn
          volumeMounts:
            - name: service-secrets
              mountPath: /var/run/ui2-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: service-secrets
          secret:
            secretName: ui2-service-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ui2-service
spec:
  selector: { app: ui2-service }
  ports: [{ name: http, port: 8080, targetPort: http }]
