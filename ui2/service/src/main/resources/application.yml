# Device job windows: UI2_JOB_WINDOW_MINUTES (1..360, default 60), shared by service and workers.
# Slots are fixed at 00:00, 06:00, 12:00, 18:00 Europe/Istanbul.
# UI 2.0 service — Phase 1 step 1 (the shell).
#
# The URL is configuration. The credentials are FILES, per C1 section 6: a
# missing, unreadable or empty file stops startup rather than falling back.
# No credential value belongs in this file, in an environment default, or in
# a build argument.
server:
  port: ${UI2_HTTP_PORT:8080}
  # The console bundle is ~750 KB of JavaScript; uncompressed it is the login
  # page's whole wait on a WAN. Compress every text response above 1 KiB.
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,text/plain,text/csv,application/javascript,application/json,image/svg+xml

spring:
  application:
    name: nexus-ui2
  http:
    converters:
      # Spring Boot 4 defaults to Jackson 3. Every response DTO, @JsonProperty and JsonNode here is Jackson 2,
      # so HTTP JSON stays on Jackson 2 (spring-boot-jackson2); see service/build.gradle.kts.
      preferred-json-mapper: jackson2
  mvc:
    async:
      # A streamed backup download is an async request; the container default (30 s) cut a 5.8 GB MDS backup at
      # ~150 MB (measured 2026-09-24). Six hours covers the largest archive on a slow link.
      request-timeout: ${UI2_ASYNC_REQUEST_TIMEOUT_MS:21600000}
  flyway:
    enabled: false
  web:
    resources:
      static-locations: classpath:/static/

ui2:
  scheduling:
    enabled: ${UI2_SCHEDULING_ENABLED:true}
  db:
    url: ${UI2_DB_URL:jdbc:postgresql://localhost:5432/ui2}
    user-file: ${UI2_DB_APP_USER_FILE:/run/secrets/ui2_db_app_user}
    password-file: ${UI2_DB_APP_PASSWORD_FILE:/run/secrets/ui2_db_app_password}
    migrate-user-file: ${UI2_DB_MIGRATE_USER_FILE:/run/secrets/ui2_db_migrate_user}
    migrate-password-file: ${UI2_DB_MIGRATE_PASSWORD_FILE:/run/secrets/ui2_db_migrate_password}
    migration-location: classpath:db/migration
  local-auth:
    # Development default: nothing forces a password change. Turn on for a
    # production posture; PO directive 2026-09-14 (hardening is optional and
    # configurable, never a development-time obligation).
    enforce-password-change-on-first-login: ${UI2_LOCAL_AUTH_ENFORCE_PASSWORD_CHANGE_ON_FIRST_LOGIN:false}
  session:
    cookie:
      # Secure by default: a deployment must opt out explicitly. A browser
      # refuses to store a Secure cookie from a plain-HTTP origin, so on a
      # TLS-less development deployment every login succeeded server-side
      # while the client stayed unauthenticated, and the session left behind
      # then collided with the next attempt. Set false only where the origin
      # is not HTTPS; never in a TLS deployment.
      secure: ${UI2_SESSION_COOKIE_SECURE:true}
  role-binding:
    # C3 section 4.2's role_bindings.group_reference_encrypted envelope key
    # (secrets_metadata purpose 'role_binding_group_ref_key'): a base64
    # -encoded 256-bit key, read once at startup, never a property default.
    group-reference-key-file: ${UI2_ROLE_BINDING_GROUP_REFERENCE_KEY_FILE:/run/secrets/ui2_role_binding_group_reference_key}
    group-reference-key-id: ${UI2_ROLE_BINDING_GROUP_REFERENCE_KEY_ID:role_binding_group_ref_key_v1}
  credential-store:
    # 2026-09-14 CS-2: a second, separately named key from the role-binding
    # key above (C1 §6.1 scopes secrets per purpose) -- base64-encoded
    # 256-bit, read once at startup, never a property default.
    key-file: ${UI2_CREDENTIAL_STORE_KEY_FILE:/run/secrets/ui2_credential_store_key}
    key-id: ${UI2_CREDENTIAL_STORE_KEY_ID:credential_store_key_v1}
  failover:
    # CF-P0.5: the durable local-storage fallback for the schedule-signing
    # master secret, used only when NEXUS_FAILOVER_MASTER_SECRET and
    # nexus.failover.master-secret are both unset. Generated once and
    # persisted on first use so a process restart reads the same key back
    # rather than minting an ephemeral one (see FailoverKeyManagementService).
    master-key-file: ${UI2_FAILOVER_MASTER_KEY_FILE:.nexus_failover_master.key}
  packet-analysis:
    # PO decision record 2026-10-15 §5: captures live only on the analysis volume (ui2-packet-analysis-data),
    # at most 2 GB per file, and an upload that would take the store past 100 GB is refused.
    root: ${UI2_PACKET_ANALYSIS_ROOT:/app/packet-analysis}
    max-file-bytes: ${UI2_PACKET_ANALYSIS_MAX_FILE_BYTES:2147483648}
    max-store-bytes: ${UI2_PACKET_ANALYSIS_MAX_STORE_BYTES:107374182400}
    # Host telemetry text files (sar, vmstat, ...) attached to a case: at most 200 MB each, same store, same 7 days.
    max-telemetry-bytes: ${UI2_PACKET_ANALYSIS_MAX_TELEMETRY_BYTES:209715200}
  sanitizer:
    # Data Sanitizer (docs/design/DATA_SANITIZER_CONTRACT.md §3.1). Uploads and results are temporary files of this
    # pod only (the JVM temporary directory is an emptyDir): the input is deleted when its job ends, the result after
    # its one download or after output-ttl-minutes. Vault entries expire after vault-retention-days.
    work-dir: ${UI2_SANITIZER_WORK_DIR:${java.io.tmpdir}/nexus-sanitizer}
    max-file-bytes: ${UI2_SANITIZER_MAX_FILE_BYTES:2147483648}
    vault-retention-days: ${UI2_SANITIZER_VAULT_RETENTION_DAYS:90}
    output-ttl-minutes: ${UI2_SANITIZER_OUTPUT_TTL_MINUTES:60}
    concurrent-jobs: ${UI2_SANITIZER_CONCURRENT_JOBS:2}
    # Hook points, off by default (contract §3.2/§3.3): Packet Analysis "anonymize on upload" and the system-log
    # export call SanitizerService.sanitizeFile / sanitizeLogExport when these are true.
    packet-analysis-anonymize-on-upload: ${UI2_SANITIZER_PA_ON_UPLOAD:false}
    log-export: ${UI2_SANITIZER_LOG_EXPORT:false}
  project-plan:
    # Empty by default: ProjectPlanConfiguration then locates the repository
    # checkout's own project/ directory itself (deployment_direction: local
    # validation only for this movement). An operator may point this at a
    # different checkout path explicitly.
    directory: ${UI2_PROJECT_PLAN_DIRECTORY:}

logging:
  level:
    root: INFO
