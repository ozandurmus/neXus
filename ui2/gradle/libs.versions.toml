[versions]
# JUnit 6 is what Spring Boot 4.0.8 manages (spring-boot-starter-test); one platform for every module.
junit = "6.0.3"
archunit = "1.3.0"
flyway = "10.17.0"
postgresql = "42.7.13"
jooq = "3.19.11"
unboundid = "7.0.1"
bouncycastle = "1.86"
testcontainers = "1.20.1"
# Spring Boot 4.0.8 manages Spring Framework 7.0.9 (CVE-2026-47884 / CVE-2026-47890 fixed in spring-webmvc 7.0.9).
springboot = "4.0.8"
# Spring Security line that Spring Boot 4.0.8 manages (spring-boot-starter-security resolves 7.0.7); used for the test artifact only.
spring-security = "7.0.7"
snakeyaml = "2.2"
# Security floor above Spring Boot 4.0.8's managed Tomcat 11.0.24: newest 11.0.x patch release (2026-10-06).
# Before Boot 4 the floor was 10.1.60 (Trivy 2026-09-27: critical CVEs fixed in 10.1.58).
tomcat = "11.0.27"
# Maintained drop-in fork of com.jcraft:jsch (same com.jcraft.jsch package; latest stable 0.2.x release is 0.2.26,
# mwiede/jsch ChangeLog.md: RSA SHA-2 RFC 8332 rsa-sha2-256/512, ssh-ed25519, modern KEX and AEAD/CTR ciphers;
# 0.2.26 prefers AES-GCM ciphers over AES-CTR and catches LinkageError on reflective algorithm class loading).
jsch = "0.2.26"
# SNMP device metrics (SNMP_DEVICE_METRICS_DESIGN_2026_11_24.md): SNMPv3 USM client, GET/GETBULK only. Apache 2, no
# runtime dependency; 3.13.2 released 2026-11-02.
snmp4j = "3.13.2"
jackson = "2.21.7"
# Data Sanitizer XLSX path (DATA_SANITIZER_CONTRACT.md §4); shared with the Packet Analysis export lane.
poi = "5.5.1"
# Packet Analysis store: must equal the DuckDB engine version of the frozen reference (1.5.6).
duckdb = "1.5.6.0"
# Reports R1 PDF renderer (REPORTS_R1_CONTRACT.md "Renderers"): one pure-Java jar, no mandatory dependency. The 2.2 line
# keeps the com.lowagie packages; 3.x adds a mandatory brotli4j dependency that ships native binaries (not allowed).
openpdf = "2.2.5"

[libraries]
# Already supplied by the service JDBC starter (Spring Boot 4.0.8: 7.0.2); reused by the worker.
hikari = { module = "com.zaxxer:HikariCP", version = "7.0.2" }
slf4j-api = { module = "org.slf4j:slf4j-api", version = "2.0.18" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
unboundid-ldapsdk = { module = "com.unboundid:unboundid-ldapsdk", version.ref = "unboundid" }
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# OpenSAML (via cryptacular) brings bcpkix and bcutil 1.77; a bcprov 1.86 beside them fails with NoClassDefFoundError
# (EdECObjectIdentifiers), so the three move together (constraints in service/build.gradle.kts).
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-util = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
# Spring Boot 4 renamed spring-boot-starter-web to spring-boot-starter-webmvc (the old name is a deprecated alias).
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc", version.ref = "springboot" }
# Jackson 2 for Spring MVC message conversion (Boot 4 defaults to Jackson 3); see service/build.gradle.kts.
spring-boot-jackson2 = { module = "org.springframework.boot:spring-boot-jackson2", version.ref = "springboot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "springboot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springboot" }
# @WebMvcTest / @AutoConfigureMockMvc moved to their own module in Spring Boot 4.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test", version.ref = "springboot" }
# Spring Security 7 (version managed by the Spring Boot 4.0.8 BOM); Step 1 of docs/design/SPRING_SECURITY_MIGRATION_PLAN_2026_11_15.md.
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springboot" }
# SAML 2.0 service provider (ADFS), Step 4 of the migration plan; brings OpenSAML 5 from the Shibboleth release repository.
spring-security-saml2-service-provider = { module = "org.springframework.security:spring-security-saml2-service-provider", version.ref = "spring-security" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version.ref = "spring-security" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
snmp4j = { module = "org.snmp4j:snmp4j", version.ref = "snmp4j" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
# Metrics (enterprise phase 0.4): the version Spring Boot 4.0.8 manages; no Actuator, the scrape endpoint is NexusMetrics's own
# separate-port server (docs/operations/METRICS.md).
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version = "1.16.7" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springboot" }
