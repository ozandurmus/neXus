# pan_configuration_collect -- the Palo Alto half of configuration
# collection (PO_DECISION_RECORD_2026_09_14G CG-4, gate consequence). The
# four xml_api_call steps below are CG-4's exact request set, in order
# (identity refresh, active, effective-running, merged), gated per
# docs/design/PAN_CONFIGURATION_API_ROUTE_GATE_ENTRIES.md entries 1-4,
# mirroring pan_inventory_collect.yaml's own shape exactly.
#
# The real device contact never runs this capability's own step list
# through StepExecutor: it runs through worker.configuration.
# ConfigurationJobExecutor/ConfigurationCapabilityExecutor against the
# closed read set (worker.configuration.ConfigurationReadPlan), because
# StepExecutor's single-command-per-step shape cannot express the
# streaming XML category-index/override-detection processing (CG-5/CG-6/
# CG-7a/CG-7b) the real read plan needs. These steps exist so C4 execution
# eligibility is computed from real gate resolution.
#
# Admitted only against ENROLLED, non-disabled devices (14G CG-8).
capability_id: pan_configuration_collect
vendor: palo_alto
platform_role_scope: pan_firewall
maturity_state: CAP_VALIDATED
transport:
  kind: pan_xml_api
  trust_rule_ref: utils.pan_xml_api_trust
steps:
  - kind: connect
  - kind: xml_api_call
    send: "<show><system><info/></system></show>"
    # Shares gate_id pan_inventory_show_system_info (identical canonical key) -- see gate_registry_fixture.yaml's own note.
    gate_reference: pan_inventory_show_system_info
  - kind: xml_api_call
    send: "type=config&action=show&xpath=/config"
    gate_reference: pan_configuration_active
  - kind: xml_api_call
    send: "<show><config><effective-running/></config></show>"
    gate_reference: pan_configuration_effective_running
  - kind: xml_api_call
    send: "<show><config><merged/></config></show>"
    gate_reference: pan_configuration_merged
finally_steps:
  - kind: disconnect
parser_ref:
  parser_version: "14G"
  semantics_doc_ref: "docs/design/PO_DECISION_RECORD_2026_09_14G_CONFIGURATION_COLLECTION_MEASURED_FORMS.md"
source_pointers:
  - "worker.configuration.ConfigurationCapabilityExecutor (the closed read set this capability's own execution defers to)"
  - "worker.configuration.ConfigurationReadPlan (CG-4 literals)"
  - "worker.configuration.pan.PaloAltoConfigStreamProcessor (CG-5/CG-6/CG-7a/CG-7b streaming category index and override detection)"
  - "worker.configuration.pan.PanoramaAssignmentReducer (CG-7 assignment index, fixture-driven)"
validation_status: FIXTURE_ONLY
revalidation_plan_ref: "docs/design/PAN_CONFIGURATION_API_ROUTE_GATE_ENTRIES.md -- parser bindings unverified until the first live run from the product"
