# pan_inventory_collect -- the Palo Alto half of inventory collection
# (PO_DECISION_RECORD_2026_09_14C D-1/D-2); see cp_inventory_collect.yaml's
# own header comment for why this capability's step list is a placeholder
# never executed by StepExecutor (execution runs through
# worker.inventory.InventoryJobExecutor/InventoryCapabilityExecutor
# instead, over the closed worker.inventory.InventoryReadPlan).
#
# Admitted only against ENROLLED, non-disabled devices (14C D-1).
capability_id: pan_inventory_collect
vendor: palo_alto
platform_role_scope: pan_firewall
maturity_state: CAP_OFFLINE
transport:
  kind: pan_xml_api
  trust_rule_ref: utils.pan_xml_api_trust
steps:
  - kind: connect
finally_steps:
  - kind: disconnect
parser_ref:
  parser_version: UNKNOWN
  semantics_doc_ref: "docs/design/PO_DECISION_RECORD_2026_09_14C_INVENTORY_AND_CONFIGURATION_COLLECTION_DESIGN.md section 3"
source_pointers:
  - "worker.inventory.InventoryCapabilityExecutor (the closed read set this capability's own execution defers to)"
validation_status: FIXTURE_ONLY
revalidation_plan_ref: "docs/design/PO_DECISION_RECORD_2026_09_14C_INVENTORY_AND_CONFIGURATION_COLLECTION_DESIGN.md section 5"
