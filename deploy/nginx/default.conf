# DEV.3.1 — serves the static report from the shared runtime volume's
# output/ subdirectory. Read-only by mount (see docker-compose.yml);
# nginx itself never writes here.
server {
    listen 80;
    server_name _;

    root /runtime/output;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
