# Only synthetic test data. Source is per-run; dependency caches use a dedicated PVC.
# The build has no NetworkPolicy; the orchestrator installs DNS/proxy-only egress
# before this Job, resolving the host-local build proxy without recording its values.
apiVersion: batch/v1
kind: Job
metadata:
  name: INTEGRATION_RUN
  namespace: ui2-build
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        nexus-integration-run: INTEGRATION_RUN
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        emptyDir: {}
      - name: socket
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: password
        secret:
          secretName: INTEGRATION_RUN
          defaultMode: 0440
      - name: workspace
        emptyDir: {}
      - name: gradle-cache
        persistentVolumeClaim:
          claimName: ui2-integration-gradle-cache
      - name: home
        emptyDir: {}
      - name: runner-tmp
        emptyDir: {}
      - name: corp-ca
        configMap:
          name: corp-ca
      initContainers:
      - name: postgres
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
        - name: POSTGRES_PASSWORD_FILE
          value: /run/test-secret/password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          periodSeconds: 2
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: socket
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        - name: password
          mountPath: /run/test-secret
          readOnly: true
        restartPolicy: Always
        args:
        - -c
        - listen_addresses=127.0.0.1
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
          periodSeconds: 2
          failureThreshold: 90
      containers:
      - name: runner
        image: registry.access.redhat.com/ubi9/openjdk-21@sha256:645710be17ff582b0f2eb5d52f572556a2b73f4367290548bbc89431213e3ece
        command:
        - /bin/bash
        - -c
        args:
        - |
          set -eu
          until [ -f /workspace/ready ]; do sleep 1; done
          exec bash /workspace/scripts/integration_runner.sh
        env:
        - name: HOME
          value: /home/runner
        - name: GRADLE_USER_HOME
          value: /workspace/ui2/.gradle-home
        - name: UI2_TEST_JDBC_URL
          value: jdbc:postgresql://127.0.0.1:5432/postgres
        - name: UI2_TEST_DB_PASSWORD_FILE
          value: /run/test-secret/password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '3'
            memory: 4Gi
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: gradle-cache
          mountPath: /workspace/ui2/.gradle-home/caches
        - name: home
          mountPath: /home/runner
        - name: runner-tmp
          mountPath: /tmp
        - name: password
          mountPath: /run/test-secret
          readOnly: true
        - name: corp-ca
          mountPath: /run/corp-ca
          readOnly: true
