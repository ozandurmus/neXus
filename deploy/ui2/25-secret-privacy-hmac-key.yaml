# The AIView pseudonymizer's HMAC key (TopologyNamePseudonymizer, V53
# pseudonym_registry). A separate purpose, a separate key (C1 §6.1): never
# the credential-store, role-binding, artefact-store or hostname-fingerprint
# key.
#
# Why it is a Secret (2026-09-23): the key used to be generated into the
# container's HOME, an emptyDir, so every new service pod made a new key,
# every raw name got a new registry key, and every aiview pseudonym shifted
# on each deploy (CLS-LIMA-07 became CLS-DELTA-02 for the same cluster). The
# Product Owner and the agents converse in these pseudonyms; they must not
# move.
#
# The repository tracks the Secret's *contract* -- its name, its Opaque
# type and its key name -- and never its content. This file carries no
# `data` and no `stringData`, in any encoding. The live value is created in
# the cluster from a value generated at creation time, by the procedure in
# docs/operations/UI2_LOCAL_KUBERNETES_DEPLOYMENT.md §5c, which patches this
# object, so re-applying this directory never removes the live value.
#
#   key   the pseudonymizer's HMAC key material (base64 text, 32 bytes)
apiVersion: v1
kind: Secret
metadata:
  name: ui2-privacy-hmac-key
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
type: Opaque
