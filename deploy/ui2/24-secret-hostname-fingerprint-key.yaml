# B1-1c §7, SEC-1 and SEC-2, mirroring 23-secret-artefact-store-key.yaml
# exactly. BK-16 / C7 section 3.2: the backup_artefact manifest's
# hostname_fingerprint HMAC key -- a separate purpose, a separate key
# (C1 §6.1), never the artefact-store encryption, credential-store or
# role-binding key.
#
# The repository tracks the Secret's *contract* -- its name, its Opaque
# type and its key names -- and never its content. This file therefore
# carries no `data` and no `stringData`, in any encoding.
#
# The live value is created in the cluster from a value generated at
# creation time (SEC-3), by the operator procedure in
# docs/operations/UI2_LOCAL_KUBERNETES_DEPLOYMENT.md. That procedure
# patches this object rather than applying over it, so re-applying this
# directory never removes the live value.
#
# Key name, which is the part this file is allowed to state:
#
#   key   the worker role's hostname-fingerprint HMAC key material
apiVersion: v1
kind: Secret
metadata:
  name: ui2-hostname-fingerprint-key
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
type: Opaque
