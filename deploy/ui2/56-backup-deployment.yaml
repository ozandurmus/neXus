apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui2-backup
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: backup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus-ui2
      app.kubernetes.io/component: backup
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nexus-ui2
        app.kubernetes.io/component: backup
    spec:
      securityContext:
        runAsNonRoot: true
      priorityClassName: system-cluster-critical
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: artefact-store
          persistentVolumeClaim:
            claimName: ui2-artefact-store
      containers:
        - name: backup
          image: registry.kube-system.svc.cluster.local/nexus-ui2-service:latest
          args: ["worker", "backup"]
          env:
            - name: NEXUS_BACKUP_PORT
              value: "8086"
            - name: UI2_ARTEFACT_STORE_ROOT
              value: "/app/artefact-store"
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /app/tmp
            - name: artefact-store
              mountPath: /app/artefact-store
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8086
            initialDelaySeconds: 3
            periodSeconds: 5
