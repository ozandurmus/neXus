# B1-1c §5.2: in-cluster reach to the database workload. ClusterIP only, per
# OS-9: external reach is through the ingress object alone, which never
# fronts the database.
apiVersion: v1
kind: Service
metadata:
  name: ui2-db
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
