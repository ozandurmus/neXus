apiVersion: v1
kind: Service
metadata:
  name: ui2-service-internal
  namespace: ui2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: machine
      port: 8086
      targetPort: machine
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui2-service-machine-port
  namespace: ui2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: nexus-ui2
      app.kubernetes.io/component: service
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 1
          endPort: 8085
        - protocol: TCP
          port: 8087
          endPort: 65535
        - protocol: UDP
          port: 1
          endPort: 65535
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: e2e
      ports:
        - protocol: TCP
          port: 8086
    # Advisory fetch workload (docs/design/ADVISORY_MATCHING_CONTRACT.md section 3): the ingest endpoints are on this port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: advisory-fetch
      ports:
        - protocol: TCP
          port: 8086
    # Script Execution broker (SCRIPT_EXECUTION_CONTRACT.md Amendment 2026-11-18 (b) item 4): start, finish, abort.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: script-runner
      ports:
        - protocol: TCP
          port: 8086
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ui2-security
          podSelector:
            matchLabels:
              app.kubernetes.io/component: security-scan
      ports:
        - protocol: TCP
          port: 8086
    # Metrics scrape example (docs/operations/METRICS.md): disabled by default (UI2_METRICS_ENABLED=false).
    # When enabled, an operator may allow an in-cluster Prometheus scraper on internal port 8086 (or port metrics):
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: monitoring
    #       podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: prometheus
    #   ports:
    #     - protocol: TCP
    #       port: 8086
