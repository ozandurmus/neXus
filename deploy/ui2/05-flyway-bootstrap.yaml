apiVersion: batch/v1
kind: Job
metadata:
  name: ui2-flyway-bootstrap
  namespace: ui2
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # The upstream Flyway image defaults to root; its installation is world-readable.
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: flyway/flyway:10.17.0@sha256:354e5d5aec18d8d9d57ede196f02fdc66f6ee86a50e3bddfe1b001265817eadb
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          args: ["-connectRetries=10", "migrate"]
          env:
            - name: HOME
              value: /tmp
            - name: JAVA_ARGS
              value: "-Duser.home=/tmp -Djava.io.tmpdir=/tmp"
            - name: FLYWAY_URL
              value: "jdbc:postgresql://ui2-db:5432/ui2"
            - name: FLYWAY_USER
              valueFrom: { secretKeyRef: { name: ui2-db, key: migrate-user } }
            - name: FLYWAY_PASSWORD
              valueFrom: { secretKeyRef: { name: ui2-db, key: migrate-password } }
            - name: FLYWAY_LOCATIONS
              value: "filesystem:/flyway/sql"
          volumeMounts:
            - { name: sql, mountPath: /flyway/sql, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: sql
          configMap: { name: ui2-migrations }
