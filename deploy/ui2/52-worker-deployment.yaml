# B1-1c §5.2: the `worker` role workload, alongside the `service` role in
# 50-service-deployment.yaml. `scheduler` remains deferred by the contract,
# not omitted by accident.
#
# `replicas: 1` at stages 1 and 2 (§6.4): at one replica the start-up
# migration is safe without a concurrent-migration guard, and RESET-3 makes
# the restart after a reset meaningful.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui2-worker
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus-ui2
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nexus-ui2
        app.kubernetes.io/component: worker
    spec:
      # FS-7: no fixed uid, no fixed gid and no volume group id is set
      # anywhere in this set; only the non-root assertion is made, and the
      # image's numeric account is what it is validated against (FS-6).
      securityContext:
        runAsNonRoot: true
      # EP-4: the process must terminate on SIGTERM within this window
      # without leaving in-flight work mid-step.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          # BP-7/OS-10: an immutable reference. Same image as the service
          # role: the workload role is selected by args, not by a second
          # image or a second tag (EP-1).
          image: registry.kube-system.svc.cluster.local/nexus-ui2-service@sha256:c57b8aab8d58d77ab68bed80e1cb5e3d23d47a6c4b71acb848fad1b86bd33365
          # EP-1: the workload role is an argument, not a second image, a
          # second tag or a shell-interpreted environment variable.
          args: ["worker"]
          env:
            # SEC-4: the non-secret half of the connection comes from the
            # ConfigMap and the DSN is assembled in the process. No complete
            # DSN containing a credential exists in a manifest, a ConfigMap,
            # an image layer, an argument or a log line.
            - name: UI2_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ui2-config
                  key: db_host
            - name: UI2_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ui2-config
                  key: db_port
            - name: UI2_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ui2-config
                  key: db_name
            - name: UI2_DB_URL
              value: "jdbc:postgresql://$(UI2_DB_HOST):$(UI2_DB_PORT)/$(UI2_DB_NAME)"
            - name: LOGGING_LEVEL_ROOT
              valueFrom:
                configMapKeyRef:
                  name: ui2-config
                  key: log_level
            # The credential reaches the process as four mounted files, per
            # the C1 §6 secret-file rule the composition root implements: a
            # missing, unreadable or empty file stops start-up rather than
            # falling back. These entries carry paths, never values.
            - name: UI2_DB_APP_USER_FILE
              value: /run/secrets/ui2-db/app-user
            - name: UI2_DB_APP_PASSWORD_FILE
              value: /run/secrets/ui2-db/app-password
            - name: UI2_DB_MIGRATE_USER_FILE
              value: /run/secrets/ui2-db/migrate-user
            - name: UI2_DB_MIGRATE_PASSWORD_FILE
              value: /run/secrets/ui2-db/migrate-password
            # The worker role additionally needs the credential-store and
            # role-binding keys. Both reach the process by reference only
            # (SEC-4): no literal value carries a credential.
            - name: UI2_CREDENTIAL_STORE_KEY_FILE
              value: /run/secrets/ui2-credential-store/key
            - name: UI2_ROLE_BINDING_GROUP_REFERENCE_KEY_FILE
              value: /run/secrets/ui2-role-binding/key
            # NXS-LOCAL-0165: the configuration-collection artefact store's
            # own key (worker role only -- service never decrypts a raw
            # artefact; C7 section 4 minimum). UI2_ARTEFACT_STORE_ROOT is
            # not a secret -- it is the emptyDir path below, local
            # validation only (a persistent volume is a later, production
            # concern this movement does not take on).
            - name: UI2_ARTEFACT_STORE_KEY_FILE
              value: /run/secrets/ui2-artefact-store/key
            - name: UI2_ARTEFACT_STORE_ROOT
              value: /app/artefact-store
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # OS-6: requests and limits for both cpu and memory, matching the
          # service role's values (PORT-2 makes the magnitudes per-stage
          # values so the structure does not wait on the numbers).
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # OS-8/FS-4: the root filesystem is read only and each declared
          # writable path of FS-3 — the JVM temporary directory and the
          # declared HOME — is supplied as an emptyDir. An image-layer path
          # is never a writable path at runtime.
          volumeMounts:
            - name: tmp
              mountPath: /app/tmp
            - name: home
              mountPath: /app/home
            - name: db-credentials
              mountPath: /run/secrets/ui2-db
              readOnly: true
            - name: credential-store-key
              mountPath: /run/secrets/ui2-credential-store
              readOnly: true
            - name: role-binding-key
              mountPath: /run/secrets/ui2-role-binding
              readOnly: true
            - name: artefact-store-key
              mountPath: /run/secrets/ui2-artefact-store
              readOnly: true
            # NXS-LOCAL-0165: the raw encrypted artefact bytes themselves
            # (FileArtefactStore) -- worker-only, ephemeral (emptyDir) at
            # this local-validation stage; not one of the two closed
            # writable paths the image itself declares (FS-3), which stay
            # service-only.
            - name: artefact-store
              mountPath: /app/artefact-store
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: db-credentials
          secret:
            secretName: ui2-db
            defaultMode: 0440
        - name: credential-store-key
          secret:
            secretName: ui2-credential-store-key
            defaultMode: 0440
        - name: role-binding-key
          secret:
            secretName: ui2-role-binding-key
            defaultMode: 0440
        - name: artefact-store-key
          secret:
            secretName: ui2-artefact-store-key
            defaultMode: 0440
        - name: artefact-store
          emptyDir: {}
