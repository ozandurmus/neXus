# Administration > System (2026-09-22): the service reads the pods of its own
# namespace and their metrics, read-only, for the service view. No write verb.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ui2-status-reader
  namespace: ui2
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ui2-status-reader
  namespace: ui2
subjects:
  - kind: ServiceAccount
    name: default
    namespace: ui2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ui2-status-reader
