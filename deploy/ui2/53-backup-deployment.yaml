# Backup module worker (MODULE_PER_POD_PLAN.md step 2, MODULE_POD_RUNTIME_CONTRACT.md).
# Committed at replicas: 0 while general fallback remains active; module_deploy.py scales to 1 and hands over ownership
# only after a live module heartbeat and an explicit PO authorization reference.
# No CPU limit: MODULE_POD_RUNTIME_CONTRACT.md.
# A copy of deploy/ui2/01-priority-classes.yaml's ui2-worker (identical; tests assert it), so this file applies on its own.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ui2-worker
  labels:
    app.kubernetes.io/part-of: nexus-ui2
value: 800000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "neXus device-job workers: below the service, above packet analysis and previews."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui2-backup
  namespace: ui2
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui2-backup
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: backup
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus-ui2
      app.kubernetes.io/component: backup
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nexus-ui2
        app.kubernetes.io/component: backup
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # OS-3a (amendment 2026-09-24): the group of the Radware Cyber Controller / Quantum Spark push inbox
        # (HOST-A nexuscc, gid 2600), so the backup worker can read and delete its uploads -- a supplemental group,
        # not a fixed uid/gid (FS-7).
        supplementalGroups: [2600]
      priorityClassName: ui2-worker
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 900
      containers:
      - name: backup
        image: registry.kube-system.svc.cluster.local/nexus-ui2-service@sha256:966cf85b73bc107cc4331f9967f98dfad864e0035d96ea97aa4848fd7deeb136
        args:
        - worker
        - backup
        # Metrics (docs/operations/METRICS.md): disabled by default (UI2_METRICS_ENABLED=false). Example container port:
        # ports:
        # - name: metrics
        #   containerPort: 9404
        #   protocol: TCP
        ports:
        # Kubelet probes only (WorkerHealthServer): no Service, Ingress or NetworkPolicy entry.
        - name: health
          containerPort: 9405
          protocol: TCP
        env:
        - name: UI2_METRICS_ENABLED
          value: "false"
        - name: UI2_HEALTH_PORT
          value: "9405"
        # PO 2026-11-15: application logs on HOST-A show IP addresses (the code default stays masked).
        # Logs never leave HOST-A raw; aiview, diagnostics and bundles mask separately.
        - name: NEXUS_LOG_RAW_ADDRESSES
          value: "1"
        # Console log format (json|text, default text; flip to json for one JSON object per line):
        # - name: UI2_LOG_FORMAT
        #   value: "json"
        - name: UI2_JOB_WINDOW_MINUTES
          value: "360"
        - name: NEXUS_FAILOVER_MUTATION_ENABLED
          value: "true"
        - name: UI2_BACKUP_POLL_INTERVAL_SECONDS
          value: "30"
        - name: UI2_CP_BACKUP_CREDENTIAL_REF
          value: "a5c22471-26af-4cb1-a13e-090311c88c96"
        - name: UI2_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: db_host
        - name: UI2_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: db_port
        - name: UI2_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: db_name
        - name: UI2_DB_URL
          value: jdbc:postgresql://$(UI2_DB_HOST):$(UI2_DB_PORT)/$(UI2_DB_NAME)
        - name: LOGGING_LEVEL_ROOT
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: log_level
        - name: PAN_DISCOVERY_TRUST_PINNED_FINGERPRINT_SHA256
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: pan_discovery_trust_pinned_fingerprint_sha256
              optional: true
        - name: UI2_DB_APP_USER_FILE
          value: /run/secrets/ui2-db/app-user
        - name: UI2_DB_APP_PASSWORD_FILE
          value: /run/secrets/ui2-db/app-password
        - name: UI2_CREDENTIAL_STORE_KEY_FILE
          value: /run/secrets/ui2-credential-store/key
        - name: UI2_ARTEFACT_STORE_KEY_FILE
          value: /run/secrets/ui2-artefact-store/key
        - name: UI2_ARTEFACT_STORE_ROOT
          value: /app/artefact-store
        - name: UI2_REPORT_STORE_ROOT
          value: /app/report-store
        - name: UI2_HOSTNAME_FINGERPRINT_KEY_FILE
          value: /run/secrets/ui2-hostname-fingerprint/key
        - name: UI2_CC_INBOX_DIR
          value: /app/cc-inbox
        - name: UI2_CC_RECEIVER_HOST
          valueFrom:
            configMapKeyRef:
              name: ui2-cc-receiver
              key: host
              optional: true
        - name: JAVA_TOOL_OPTIONS
          value: -Dui2.db.pool.maximum-pool-size=4 -Dui2.db.pool.minimum-idle=1
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        # Pod hygiene (2026-11-23): kubelet probes on the worker's own probe port (UI2_HEALTH_PORT, WorkerHealthServer),
        # independent of UI2_METRICS_ENABLED. /livez reads in-process claim-loop timestamps only (no database call): it fails
        # when an idle claim loop has not iterated for 120 s (UI2_HEALTH_STALL_SECONDS), so a stalled pod restarts after
        # about 2-3 minutes. A loop running a job, a database outage and a draining pod (SIGTERM drain or module ownership
        # lost) never fail it. /readyz: loops started and the last module heartbeat reached the database within 60 s.
        # The kubelet probes from the pod's own node; node-local traffic is not subject to NetworkPolicy here (k3s).
        startupProbe:
          httpGet:
            path: /livez
            port: health
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /livez
            port: health
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /app/tmp
        - name: home
          mountPath: /app/home
        - name: db-credentials
          mountPath: /run/secrets/ui2-db
          readOnly: true
        - name: credential-store-key
          mountPath: /run/secrets/ui2-credential-store
          readOnly: true
        - name: artefact-store-key
          mountPath: /run/secrets/ui2-artefact-store
          readOnly: true
        - name: hostname-fingerprint-key
          mountPath: /run/secrets/ui2-hostname-fingerprint
          readOnly: true
        - name: artefact-store
          mountPath: /app/artefact-store
        - name: report-store
          mountPath: /app/report-store
        - name: cc-inbox
          mountPath: /app/cc-inbox
        - name: corp-ca
          mountPath: /run/corp-ca
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: db-credentials
        secret:
          secretName: ui2-db
          items:
          - key: app-user
            path: app-user
          - key: app-password
            path: app-password
          defaultMode: 288
      - name: credential-store-key
        secret:
          secretName: ui2-credential-store-key
          defaultMode: 288
      - name: artefact-store-key
        secret:
          secretName: ui2-artefact-store-key
          defaultMode: 288
      - name: hostname-fingerprint-key
        secret:
          secretName: ui2-hostname-fingerprint-key
          defaultMode: 288
      - name: artefact-store
        persistentVolumeClaim:
          claimName: ui2-artefact-store
      - name: report-store
        persistentVolumeClaim:
          claimName: ui2-report-store
      - name: cc-inbox
        hostPath:
          path: /var/lib/nexus-cc/in
          type: Directory
      - name: corp-ca
        configMap:
          name: corp-ca
      serviceAccountName: ui2-backup
      automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui2-backup
  namespace: ui2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backup
      app.kubernetes.io/part-of: nexus-ui2
  policyTypes:
  - Ingress
  - Egress
  # Metrics scrape note (docs/operations/METRICS.md): ingress stays closed by default. When UI2_METRICS_ENABLED=true,
  # an operator may allow an in-cluster Prometheus scraper pod on the internal metrics port, for example:
  # ingress:
  # - from:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: prometheus
  #   ports:
  #   - protocol: TCP
  #     port: metrics
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
    ports:
    - protocol: TCP
      port: 22
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8082
