# B1-1c §7, SEC-1 and SEC-2.
#
# The repository tracks the Secret's *contract* — its name, its Opaque type
# and its key names — and never its content. This file therefore carries no
# `data` and no `stringData`, in any encoding: a tracked base64 value is a
# tracked credential, and the encoding is not a protection.
#
# The live value is created in the cluster from a value generated at
# creation time (SEC-3), by the operator procedure in
# docs/operations/UI2_LOCAL_KUBERNETES_DEPLOYMENT.md. That procedure patches
# this object rather than applying over it, so re-applying this directory
# never removes the live value.
#
# Key name, which is the part this file is allowed to state:
#
#   key   the worker role's credential-store key material
apiVersion: v1
kind: Secret
metadata:
  name: ui2-credential-store-key
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
type: Opaque
