apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui2-compliance
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: compliance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus-ui2
      app.kubernetes.io/component: compliance
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nexus-ui2
        app.kubernetes.io/component: compliance
    spec:
      securityContext:
        runAsNonRoot: true
      priorityClassName: system-cluster-critical
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 15
      containers:
        - name: compliance
          image: registry.kube-system.svc.cluster.local/nexus-ui2-service:latest
          args: ["worker", "compliance"]
          env:
            - name: NEXUS_COMPLIANCE_PORT
              value: "8085"
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ui2-compliance
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: compliance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: compliance
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      protocol: TCP
