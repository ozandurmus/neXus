# A copy of deploy/ui2/01-priority-classes.yaml's ui2-core (identical; tests assert it), so this file applies on its own.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ui2-core
  labels:
    app.kubernetes.io/part-of: nexus-ui2
value: 900000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "neXus service and its HTTP microservices: below the database, above the workers."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui2-compliance
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: compliance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus-ui2
      app.kubernetes.io/component: compliance
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nexus-ui2
        app.kubernetes.io/component: compliance
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: ui2-core
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 15
      containers:
        - name: compliance
          image: registry.kube-system.svc.cluster.local/nexus-ui2-service@sha256:966cf85b73bc107cc4331f9967f98dfad864e0035d96ea97aa4848fd7deeb136
          args: ["worker", "compliance"]
          env:
            - name: UI2_METRICS_ENABLED
              value: "false"
            - name: UI2_METRICS_PORT
              value: "9404"
            # PO 2026-11-15: application logs on HOST-A show IP addresses (the code default stays masked).
            # Logs never leave HOST-A raw; aiview, diagnostics and bundles mask separately.
            - name: NEXUS_LOG_RAW_ADDRESSES
              value: "1"
            # Console log format (json|text, default text; flip to json for one JSON object per line):
            # - name: UI2_LOG_FORMAT
            #   value: "json"
            # Development mode (PO 2026-11-03): the job window spans the whole 6-hour slot, so manual jobs are never
            # refused as OUTSIDE_JOB_WINDOW. Remove (default 60) when scheduled operation resumes.
            - name: UI2_JOB_WINDOW_MINUTES
              value: "360"
            - name: NEXUS_COMPLIANCE_PORT
              value: "8085"
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
            # Metrics (docs/operations/METRICS.md): a named container port only; no Service, Ingress or NetworkPolicy entry.
            - name: metrics
              containerPort: 9404
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /app/tmp
            - name: home
              mountPath: /app/home
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ui2-compliance
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: compliance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: compliance
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      protocol: TCP
