# Manager destinations must be restricted by local deployment configuration.
# No CPU limit: MODULE_POD_RUNTIME_CONTRACT.md. Artifact PVC placement constraints remain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui2-policy
  namespace: ui2
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui2-policy
  namespace: ui2
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: policy
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: nexus-ui2
      app.kubernetes.io/component: policy
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nexus-ui2
        app.kubernetes.io/component: policy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: system-cluster-critical
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 900
      containers:
      - name: policy
        image: registry.kube-system.svc.cluster.local/nexus-ui2-service@sha256:966cf85b73bc107cc4331f9967f98dfad864e0035d96ea97aa4848fd7deeb136
        args:
        - worker
        - policy
        env:
        # PO 2026-10-08: failover mutation enabled; set to "false" to disable writes (restart required)
        - name: NEXUS_FAILOVER_MUTATION_ENABLED
          value: "true"
        - name: UI2_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: db_host
        - name: UI2_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: db_port
        - name: UI2_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: db_name
        - name: UI2_DB_URL
          value: jdbc:postgresql://$(UI2_DB_HOST):$(UI2_DB_PORT)/$(UI2_DB_NAME)
        - name: LOGGING_LEVEL_ROOT
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: log_level
        - name: PAN_DISCOVERY_TRUST_PINNED_FINGERPRINT_SHA256
          valueFrom:
            configMapKeyRef:
              name: ui2-config
              key: pan_discovery_trust_pinned_fingerprint_sha256
              optional: true
        - name: UI2_DB_APP_USER_FILE
          value: /run/secrets/ui2-db/app-user
        - name: UI2_DB_APP_PASSWORD_FILE
          value: /run/secrets/ui2-db/app-password
        - name: UI2_CREDENTIAL_STORE_KEY_FILE
          value: /run/secrets/ui2-credential-store/key
        - name: UI2_ARTEFACT_STORE_KEY_FILE
          value: /run/secrets/ui2-artefact-store/key
        - name: UI2_ARTEFACT_STORE_ROOT
          value: /app/artefact-store
        - name: JAVA_TOOL_OPTIONS
          value: -Dui2.db.pool.maximum-pool-size=6
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 8Gi
        volumeMounts:
        - name: tmp
          mountPath: /app/tmp
        - name: home
          mountPath: /app/home
        - name: db-credentials
          mountPath: /run/secrets/ui2-db
          readOnly: true
        - name: credential-store-key
          mountPath: /run/secrets/ui2-credential-store
          readOnly: true
        - name: artefact-store-key
          mountPath: /run/secrets/ui2-artefact-store
          readOnly: true
        - name: artefact-store
          mountPath: /app/artefact-store
        - name: corp-ca
          mountPath: /run/corp-ca
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: db-credentials
        secret:
          secretName: ui2-db
          items:
          - key: app-user
            path: app-user
          - key: app-password
            path: app-password
          defaultMode: 288
      - name: credential-store-key
        secret:
          secretName: ui2-credential-store-key
          defaultMode: 288
      - name: artefact-store-key
        secret:
          secretName: ui2-artefact-store-key
          defaultMode: 288
      - name: artefact-store
        persistentVolumeClaim:
          claimName: ui2-artefact-store
      - name: corp-ca
        configMap:
          name: corp-ca
      serviceAccountName: ui2-policy
      automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui2-policy
  namespace: ui2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: policy
      app.kubernetes.io/part-of: nexus-ui2
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    - ipBlock:
        cidr: ::/0
    ports:
    - protocol: TCP
      port: 22
    - protocol: TCP
      port: 443
