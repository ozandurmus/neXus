# The test pods' identity. No token is mounted and no Role/RoleBinding names it: a test pod cannot read or change any
# cluster object, including its own namespace. kubectl runs only on the host side (the deploy account), never in a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui2-test-runner
  namespace: ui2-test
  labels:
    app.kubernetes.io/part-of: nexus-ui2
automountServiceAccountToken: false
