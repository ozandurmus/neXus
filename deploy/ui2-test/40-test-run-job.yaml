# One lane test run (tools/delivery/hosta_test_run.py; docs/design/HOSTA_TEST_NAMESPACE_2026_11_24.md, DRAFT).
# A template, never applied as is: the host side (tools/delivery/hosta_test_run_remote.py, sent from the Mac's checkout,
# never taken from the candidate) replaces TEST_RUN and TEST_RUNNER_IMAGE, sets the scope env and the deadline, and
# drops the two database containers when the run has no integration phase.
#
# Only committed source of the candidate enters the pod (git archive into the workspace emptyDir); no host-local
# config, cache or credential does. No Secret: the throwaway PostgreSQL 16 password is generated by the first init
# container into a memory emptyDir and read from there by the database and the runner. The database listens on
# 127.0.0.1 only. Raw Gradle/vitest output stays in the pod's emptyDirs and dies with it; only the sanitized
# TESTRUN_SUMMARY line leaves the pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: TEST_RUN
  namespace: ui2-test
  labels:
    app.kubernetes.io/part-of: nexus-ui2
    app.kubernetes.io/component: test-run
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2700
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: nexus-ui2
        app.kubernetes.io/component: test-run
        nexus-test-run: TEST_RUN
    spec:
      priorityClassName: ui2-test
      serviceAccountName: ui2-test-runner
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: test-db
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: pg-data
        emptyDir: {}
      - name: pg-socket
        emptyDir: {}
      - name: pg-tmp
        emptyDir: {}
      - name: workspace
        emptyDir: {}
      - name: gradle-home
        emptyDir: {}
      - name: home
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      initContainers:
      - name: db-password
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        command:
        - /bin/sh
        - -c
        - umask 077 && head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /run/test-db/password
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: test-db
          mountPath: /run/test-db
      - name: postgres
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        restartPolicy: Always
        args:
        - -c
        - listen_addresses=127.0.0.1
        env:
        - name: POSTGRES_PASSWORD_FILE
          value: /run/test-db/password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
          periodSeconds: 2
          failureThreshold: 90
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
            ephemeral-storage: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: test-db
          mountPath: /run/test-db
          readOnly: true
        - name: pg-data
          mountPath: /var/lib/postgresql/data
        - name: pg-socket
          mountPath: /var/run/postgresql
        - name: pg-tmp
          mountPath: /tmp
      containers:
      - name: runner
        image: TEST_RUNNER_IMAGE
        command:
        - /bin/bash
        - -c
        args:
        - |
          set -eu
          until [ -f /workspace/ready ]; do sleep 1; done
          exec bash /workspace/.runner/test_runner_pod.sh
        env:
        - name: HOME
          value: /home/runner
        - name: GRADLE_USER_HOME
          value: /gradle-home
        - name: GRADLE_RO_DEP_CACHE
          value: /opt/gradle-ro-cache
        - name: TEST_JAVA
          value: none
        - name: TEST_GRADLE_TASKS
          value: ""
        - name: TEST_INTEGRATION
          value: "0"
        - name: TEST_VITEST
          value: "0"
        - name: UI2_TEST_JDBC_URL
          value: jdbc:postgresql://127.0.0.1:5432/postgres
        - name: UI2_TEST_DB_PASSWORD_FILE
          value: /run/test-db/password
        resources:
          requests:
            cpu: "1"
            memory: 6Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: "8"
            memory: 6Gi
            ephemeral-storage: 7Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: gradle-home
          mountPath: /gradle-home
        - name: home
          mountPath: /home/runner
        - name: tmp
          mountPath: /tmp
        - name: test-db
          mountPath: /run/test-db
          readOnly: true
