<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neXus -- PO + Orchestrator workbench</title>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<header id="topbar">
  <h1>neXus workbench</h1>
  <div id="summary-strip">loading...</div>
  <div id="poll-config">
    <label for="poll-interval">refresh (s)</label>
    <input id="poll-interval" type="number" min="2" max="3600" value="5">
    <label for="stuck-after">stuck after (s)</label>
    <input id="stuck-after" type="number" min="30" max="86400" value="900">
    <span id="poll-save-state"></span>
  </div>
</header>

<main id="app">
  <div id="token-panel" class="hidden">
    <p>Paste the token printed by <code>orchestrator.py dashboard</code> (the
      <code>#t=...</code> part of the URL it printed):</p>
    <input id="token-input" type="text" placeholder="token" autocomplete="off">
    <button id="token-save">Use this token</button>
    <div id="token-error" class="muted"></div>
  </div>

  <div id="board-wrap" class="hidden">
    <div id="board-columns"></div>

    <section id="detail-panel" class="hidden">
      <div id="detail-header">
        <button id="detail-close">&times;</button>
        <h2 id="detail-title"></h2>
      </div>
      <div id="detail-sections">
        <details class="detail-section" data-section="summary" open>
          <summary>Summary</summary>
          <div class="detail-body" id="pane-summary"></div>
        </details>
        <details class="detail-section" data-section="traffic">
          <summary>Traffic</summary>
          <div class="detail-body" id="pane-traffic"></div>
        </details>
        <details class="detail-section" data-section="changes">
          <summary>Changes</summary>
          <div class="detail-body" id="pane-changes"></div>
        </details>
        <details class="detail-section" data-section="evidence">
          <summary>Evidence</summary>
          <div class="detail-body" id="pane-evidence"></div>
        </details>
        <details class="detail-section" data-section="usage">
          <summary>Usage</summary>
          <div class="detail-body" id="pane-usage"></div>
        </details>
        <details class="detail-section" data-section="log">
          <summary>Log</summary>
          <div class="detail-body" id="pane-log"></div>
        </details>
      </div>
    </section>
  </div>
</main>

<script src="/dashboard.js"></script>
</body>
</html>
